<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="stylesheet" href="/llms/ui/app.css" />
        <link rel="stylesheet" href="/llms/ui/components/CheckBox.css" />
        <link rel="stylesheet" href="/llms/ui/components/ModelPicker.css" />
        <link rel="stylesheet" href="/llms/ui/components/TextInput.css" />
        <style>
            body {
                margin: 0;
                overflow: hidden;
            }
            #app {
                height: 100vh;
            }
            #result {
                display: none;
                font: 11px monospace;
                margin: 0;
                padding: 8px;
                white-space: pre-wrap;
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "vue": "/llms/ui/lib/vue.mjs",
                    "@servicestack/client": "/llms/ui/lib/servicestack-client.mjs",
                    "@servicestack/vue": "/llms/ui/lib/servicestack-vue.mjs",
                    "/ui/lazy.mjs": "/llms/ui/lazy.mjs",
                    "/ui/components/ModelPicker.mjs": "/llms/ui/components/ModelPicker.mjs",
                    "/ui/components/CheckBox.mjs": "/llms/ui/components/CheckBox.mjs"
                }
            }
        </script>
    </head>
    <body>
        <div id="app" class="pt-9 bg-white dark:bg-gray-900"></div>
        <pre id="result">RUNNING</pre>
        <script type="module">
            import { createApp, reactive, nextTick } from 'vue'
            import ServiceStackVue from '@servicestack/vue'
            import icons from '/llms/ui/modules/icons.mjs'
            import ModelPicker from '/llms/ui/components/ModelPicker.mjs'
            import { createDraftStore } from '/ext/jev/draftStore.mjs'
            import extension from '/ext/jev/index.mjs'
            const keepAlive = setInterval(() => {}, 10)
            const assert = (value, message) => {
                if (!value) throw Error(message)
            }
            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const flush = async () => {
                for (let i = 0; i < 10; i++) await wait(0)
                await nextTick()
            }
            const until = async (fn) => {
                for (let i = 0; i < 1000 && !fn(); i++) await wait(20)
                assert(fn(), 'Timed out waiting for UI')
            }
            const query = new URLSearchParams(location.search)
            if (query.has('dark')) document.documentElement.classList.add('dark')
            const theme = await (
                await fetch('/llms/extensions/app/themes/' + (query.has('dark') ? 'dark' : 'light') + '.json')
            ).json()
            const copy = (value) => JSON.parse(JSON.stringify(value))
            const filenames = [
                'sentiment.json',
                'support.json',
                'company-news.json',
                'email.json',
                'feedback.json',
                'relevance.json',
                'claim.json',
            ]
            const starters = await Promise.all(
                filenames.map(async (name) => ({
                    id: name.slice(0, -5),
                    filename: name,
                    revision: 1,
                    document: await (
                        await fetch('/llms/extensions/jev/recipes/' + name)
                    ).json(),
                })),
            )
            let generationModel
            let connected = false,
                generationReply,
                providerCalls = 0,
                holdRuns = false,
                failedRuns = false,
                lostSubmitReply = false,
                holdExampleName = false,
                failExampleName = false,
                exampleNameReply,
                exampleNameCalls = 0
            const submissions = new Map(), historySequences = new Map()
            const recipes = new Map([
                    [
                        'sentiment',
                        { ...copy(starters[0]), id: 'sentiment', templateId: starters[0].id },
                    ],
                ]),
                runs = new Map(),
                favourites = new Set()
            const writing = copy(starters[0].document)
            writing.name = 'AI sentiment recipe'
            const response = (value) =>
                new Response(JSON.stringify(value), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' },
                })
            const saveRecipe = (document, oldId, replaceRevision, templateId, filename) => {
                filename = recipes.get(oldId)?.filename || filename || document.name + '.json'
                const id = oldId || filename.slice(0, -5), old = recipes.get(oldId || id)
                if (!oldId && old && replaceRevision === undefined)
                    return new Response(JSON.stringify({ responseStatus: {
                        errorCode: 'RecipeExistsError', message: 'This name already exists.',
                        existingRecipe: { id, revision: old.revision },
                    } }), { status: 409 })
                if (replaceRevision !== undefined) {
                    assert(replaceRevision === old.revision, 'Replacement checks revision')
                    for (const [runId, run] of runs) if (run.recipeId === id) runs.delete(runId)
                }
                const row = { ...old, id, filename, revision: (old?.revision || 0) + 1, document: copy(document), ...(templateId ? { templateId } : {}) }
                if (oldId && oldId !== id) {
                    recipes.delete(oldId)
                    for (const run of runs.values()) if (run.recipeId === oldId) run.recipeId = id
                }
                recipes.set(id, row)
                return response(row)
            }
            const ext = {
                async get(path, options) {
                    const method = options?.method || 'GET',
                        body = options?.body ? JSON.parse(options.body) : null
                    if (path === '/status')
                        return response({
                            available: connected,
                            message: connected ? 'Connected' : 'Enable OpenRouter in provider settings.',
                            models: ['~typesafe/jev-latest', 'typesafe/jev-1.13'],
                        })
                    if (path === '/tags') return Response.json(await (await fetch('/tests/fixtures/decision-tags.json')).json())
                    if (path.startsWith('/shared-recipes?') && method === 'GET')
                        return response({
                            items: starters.map((row) => ({
                                id: row.id,
                                publishedUrl: 'https://recipes.example/'+row.id+'.json',
                                name: row.document.name,
                                description: row.document.description,
                                tags: row.document.tags,
                                questionCount: Object.keys(row.document.questions).length,
                                inputCount: Object.keys(row.document.inputSchema.properties).length,
                            })),
                        })
                    if (path === '/recipes/preview-url') {
                        const id = new URL(body.url).pathname.slice(1,-5), row = starters.find(row => row.id === id)
                        return response({ document: row.document, filename: row.filename, downloadUrl: body.url })
                    }
                    if (path === '/recipes' && method === 'GET')
                        return response({
                            items: [...recipes.values()].map((row) => ({
                                id: row.id,
                                filename: row.filename,
                                revision: row.revision,
                                favourite: favourites.has(row.id),
                                name: row.document.name,
                                description: row.document.description,
                                tags: row.document.tags,
                                questionCount: Object.keys(row.document.questions).length,
                            })),
                        })
                    if (path.startsWith('/recipes/') && method === 'GET')
                        return response(recipes.get(decodeURIComponent(path.slice(9))))
                    if (path === '/validate') {
                        if (!body.recipe?.name || body.recipe.schemaVersion !== 1)
                            return new Response(
                                JSON.stringify({ responseStatus: { message: 'Invalid recipe' } }),
                                { status: 400 },
                            )
                        return response({ recipe: body.recipe })
                    }
                    if (
                        (path === '/recipes' || path.startsWith('/recipes/')) &&
                        ['POST', 'PUT'].includes(method)
                    ) {
                        return saveRecipe(body.document, method === 'PUT' ? decodeURIComponent(path.slice(9)) : null, body.replaceRevision, null, body.filename)
                    }
                    if (path.startsWith('/recipes/') && method === 'DELETE') {
                        recipes.delete(decodeURIComponent(path.slice(9)))
                        return response({ deleted: true })
                    }
                    if (path.startsWith('/favourites/')) {
                        const id = decodeURIComponent(path.slice(12))
                        body.enabled ? favourites.add(id) : favourites.delete(id)
                        return response({ enabled: body.enabled })
                    }
                    if (path === '/runs' && method === 'POST') {
                        if (submissions.has(body.submissionId))
                            return response(runs.get(submissions.get(body.submissionId)))
                        providerCalls++
                        const answers = {}
                        for (const [key, q] of Object.entries(body.recipe.questions)) {
                            if (q.type === 'noul') answers[key] = { type: 'noul', noul: 0.91 }
                            else {
                                const options =
                                    q.type === 'choice'
                                        ? Object.keys(q.criteria)
                                        : q.criteria.map((_, i) => String(i))
                                answers[key] = {
                                    type: q.type,
                                    confidence: 0.67,
                                    probabilities: Object.fromEntries(
                                        options.map((v, i) => [v, i === 0 ? 0.78 : i === 1 ? 0.22 : 0]),
                                    ),
                                }
                                if (q.type === 'choice') answers[key].choice = options[0]
                                else {
                                    answers[key].score = 0.22
                                    answers[key].legend = Object.fromEntries(
                                        q.criteria.map((v, i) => [String(i), v]),
                                    )
                                }
                            }
                        }
                        const historyPrefix = body.recipeId || '_drafts',
                            sequence = (historySequences.get(historyPrefix) || 0) + 1
                        historySequences.set(historyPrefix, sequence)
                        const run = {
                            id: historyPrefix + '-' + String(sequence).padStart(5, '0'),
                            recipeId: body.recipeId,
                            recipe: body.recipe,
                            input: body.input,
                            request: {
                                model: body.recipe.decisionModel,
                                state: body.input,
                                questions: body.recipe.questions,
                            },
                            status: 'pending',
                            createdAt: Date.now() / 1000,
                            name: body.recipe.name,
                            model: 'typesafe/jev-1.13-20260917',
                            durationMs: 114,
                            usage: { cost: 0.000019992, input_tokens: 476, output_tokens: 70 },
                            answers: null,
                            response: null,
                            prepared: answers,
                        }
                        runs.set(run.id, run)
                        submissions.set(body.submissionId, run.id)
                        if (lostSubmitReply) {
                            lostSubmitReply = false
                            throw TypeError('Network reply lost')
                        }
                        return response(run)
                    }
                    if (path.startsWith('/runs/') && method === 'GET') {
                        const run = runs.get(decodeURIComponent(path.slice(6)))
                        if (!holdRuns && run.status === 'pending') {
                            run.completedAt = Date.now() / 1000
                            run.status = failedRuns ? 'failed' : 'succeeded'
                            run.error = failedRuns ? 'OpenRouter needs credits.' : null
                            run.answers = failedRuns ? null : run.prepared
                            run.response = { model: run.model, answers: run.answers, usage: run.usage }
                        }
                        return response(run)
                    }
                    if (path.endsWith('/example-name')) {
                        exampleNameCalls++
                        const id = decodeURIComponent(path.split('/')[2])
                        assert(runs.get(id)?.status === 'succeeded', 'Names only summarize actual successful runs')
                        if (failExampleName) return new Response(JSON.stringify({responseStatus:{message:'Summarization model unavailable'}}), {status:503})
                        if (holdExampleName) return new Promise(resolve => { exampleNameReply = () => resolve(response({label:'Late model suggestion'})) })
                        return response({label:'Delayed package needs urgent attention'})
                    }
                    if (path.endsWith('/cancel')) {
                        const run = runs.get(decodeURIComponent(path.split('/')[2]))
                        run.status = 'cancelled'
                        return response(run)
                    }
                    if (path.startsWith('/runs?') || (path === '/runs' && method === 'GET'))
                        return response({ items: [...runs.values()].reverse(), cursor: null })
                    if (path === '/history' && method === 'DELETE') {
                        runs.clear()
                        return response({ deleted: 1 })
                    }
                    if (path.startsWith('/runs/') && method === 'DELETE') {
                        runs.delete(decodeURIComponent(path.slice(6)))
                        return response({ deleted: true })
                    }
                    if (path === '/generate' || path === '/improve') {
                        generationModel = body.model
                        return await new Promise(
                            (resolve) =>
                                (generationReply = () =>
                                    resolve(
                                        response({
                                            recipe: writing,
                                            usage: { cost: 0.0001 },
                                            model: body.model,
                                        }),
                                    )),
                        )
                    }
                    throw Error('Unexpected ' + method + ' ' + path)
                },
            }
            const ctx = {
                ai: { base: '', auth: { userName: 'fixture' }, resolvePath: (path) => path },
                state: reactive({
                    models: [
                        {
                            name: 'chat-model',
                            id: 'chat-model',
                            provider: 'google',
                            release_date: '2026-04-01',
                            limit: { context: 100000 },
                            cost: { input: 1, output: 2 },
                        },
                        {
                            name: 'second-model',
                            id: 'second-model',
                            provider: 'anthropic',
                            release_date: '2026-05-01',
                            limit: { context: 200000 },
                            cost: { input: 3, output: 8 },
                            reasoning: true,
                        },
                        {
                            name: 'free-model',
                            id: 'free-model',
                            provider: 'openrouter',
                            cost: { input: 0, output: 0 },
                        },
                        {
                            name: 'image-model',
                            id: 'image-model',
                            provider: 'google',
                            modalities: { output: ['image'] },
                        },
                        { name: '~typesafe/jev-latest', id: '~typesafe/jev-latest', provider: 'openrouter' },
                    ],
                    selectedModel: 'chat-model',
                    config: { extensions: [] },
                }),
                scope: () => ({ ...ext, state: {} }),
                openModal() {},
                toast() {},
            }
            ctx.routes = []
            let rightVisible = true
            ctx.layoutVisible = () => rightVisible
            ctx.toggleLayout = (key, visible) => {
                assert(key === 'right', 'Studio closes the right sidebar')
                rightVisible = visible
            }
            ctx.togglePath = (path) => assert(path === '/jev', 'Icon opens the studio')
            ctx.setLeftIcons = (value) => (ctx.icons = value)
            ctx.matchesPath = (a, b) => a === b
            ctx.ai.resolvePath = (path) => path.replace('/ext/jev/', '/ext/jev/')
            extension.install(ctx)
            ctx.routes[0].beforeEnter()
            assert(!rightVisible, 'Direct navigation closes the right sidebar')
            rightVisible = true
            ctx.icons.jev.component.methods.open()
            assert(!rightVisible, 'Sidebar icon closes the right sidebar')
            assert(ctx.icons.jev.isActive({ path: '/jev' }), 'Icon recognizes studio route')
            const JevPage = await ctx.routes[0].component()
            let app
            const vueErrors = []
            function mount() {
                app = createApp(JevPage)
                app.use(ServiceStackVue)
                app.component('ModelPicker', ModelPicker)
                icons.install({
                    components: (value) =>
                        Object.entries(value).forEach(([name, component]) => app.component(name, component)),
                })
                app.provide('ctx', ctx)
                Object.assign(app.config.globalProperties, { $styles: theme.styles })
                app.config.errorHandler = (e) => {
                    vueErrors.push(e.stack)
                    document.getElementById('result').textContent =
                        'FAIL: ' + e.message + '\n' + e.stack + '\n' + vueErrors.join('\n')
                }
                app.mount('#app')
            }
            const button = (text) =>
                [...document.querySelectorAll('button')].find((b) => b.textContent.trim() === text)
            const click = async (text) => {
                await until(() => (typeof text === 'string' ? button(text) : text))
                const b = typeof text === 'string' ? button(text) : text
                assert(b, 'Missing button ' + text)
                b.click()
                await flush()
            }
            const input = async (el, value) => {
                assert(el, 'Missing input')
                el.value = value
                el.dispatchEvent(new Event('input', { bubbles: true }))
                await flush()
            }
            const verifySearch = async (frame) => {
                const field = frame.querySelector('input'), clear = frame.querySelector('button'), icon = frame.querySelector('svg')
                field.blur()
                await flush()
                const geometry = () => [frame, field, icon, clear].map(el => { const r = el.getBoundingClientRect(); return [r.x, r.y, r.width, r.height] })
                const before = geometry()
                const unchanged = () => geometry().every((rect, i) => rect.every((v, j) => Math.abs(v - before[i][j]) < 0.1))
                field.focus()
                await flush()
                assert(unchanged(), 'Search geometry stays fixed on focus')
                const inner = getComputedStyle(field), outer = getComputedStyle(frame)
                assert(inner.borderTopWidth === '0px' && inner.outlineStyle === 'none' && inner.boxShadow === 'none', 'Search has no inner border or focus rings')
                assert(outer.borderTopWidth === '1px' && outer.borderTopColor === 'rgb(59, 130, 246)' && outer.outlineStyle === 'none' && outer.boxShadow === 'none', 'Search uses one focus border')
                await input(field, 'unmatched-search-value')
                assert(unchanged() && !clear.disabled, 'Typing reserves the clear button space')
                clear.click()
                await flush()
                assert(field.value === '' && document.activeElement === field && unchanged(), 'Clear restores the search without moving it or losing focus')
            }
            try {
                mount()
                await until(() => button('Run decision'))
                await flush()
                await verifySearch(document.querySelector('[data-jev-library] [data-jev-search]'))
                assert(
                    document.querySelectorAll('[data-jev-recipe-row]').length === 1,
                    'Only Message sentiment initially visible',
                )
                assert(
                    !document.querySelector('[data-jev-input-form]').textContent.includes('Subject'),
                    'Sentiment has no subject field',
                )
                assert(
                    document.querySelector('[data-jev-input-form]').textContent.includes('Email, tweet or comment'),
                    'Sentiment label',
                )
                const reqAsterisk = document.querySelector('[data-jev-input-form] .text-red-500')
                assert(reqAsterisk, 'Required asterisk is rendered')
                const requiredStyle = getComputedStyle(reqAsterisk)
                assert(requiredStyle.maskImage !== 'none', 'Required asterisk has its SVG mask, not a solid square')
                const maskUrl = requiredStyle.maskImage.match(/^url\(["']?(data:image\/svg\+xml,[^"')]+)["']?\)$/)?.[1]
                const maskSvg = maskUrl && new DOMParser().parseFromString(decodeURIComponent(maskUrl.split(',')[1]), 'image/svg+xml')
                assert(maskSvg?.documentElement.localName === 'svg' && maskSvg.querySelector('path') && !maskSvg.querySelector('parsererror'), 'Asterisk mask contains valid SVG')
                const headerActions = document.querySelector('[data-jev-header-actions]')
                assert(headerActions.firstElementChild.textContent.trim() === 'Create with AI' && headerActions.lastElementChild.matches('[data-jev-connection]'), 'Jev status follows Create with AI')
                const header = document.querySelector('[data-jev-header]')
                assert((innerWidth < 850 || parseFloat(getComputedStyle(header).marginTop) < 0) && header.getBoundingClientRect().top >= 0, 'Compact header lifts into top-bar space when there is room for both sets of controls')
                assert(
                    reqAsterisk.getAttribute('title') === 'Required field',
                    'Asterisk has title denoting required field',
                )
                await click('Edit')
                assert(!document.querySelector('[data-jev-editor-fieldset]').disabled, 'Initial recipe editable')
                const contentInput = document.querySelector('[aria-label="Search or create content"]')
                const tagsInput = document.querySelector('[aria-label="Search or create tags"]')
                await until(() => document.querySelector('[data-jev-tag-picker]').textContent.includes('Email'))
                tagsInput.focus()
                await input(tagsInput, 'rou')
                await until(() => [...document.querySelectorAll('[data-jev-tag-picker] [role="option"]')].some(b => b.textContent === 'Routing'))
                const option = [...document.querySelectorAll('[data-jev-tag-picker] [role="option"]')].find(b => b.textContent === 'Routing')
                await click(option)
                assert(document.querySelector('[aria-label="Remove tags Routing"]'), 'Search finds and selects an existing tag')
                await click(document.querySelector('[aria-label="Remove tags Routing"]'))
                await input(contentInput, 'news')
                contentInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
                await flush()
                assert(document.querySelector('[aria-label="Remove content News"]') && !document.querySelector('[aria-label="Remove content Email"]'), 'Content selection replaces the single previous type')
                await input(contentInput, 'Policy documents')
                contentInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
                await flush()
                assert(document.querySelector('[aria-label="Remove content Policy documents"]'), 'New custom content type can be created')
                await input(contentInput, 'email')
                contentInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
                await flush()
                tagsInput.focus()
                await input(tagsInput, 'custom-review')
                assert([...document.querySelectorAll('[data-jev-tag-picker] [role="option"]')].some(b => b.textContent.includes('Create “custom-review”')), 'New tag creation offered when search has no matching value')
                tagsInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
                await flush()
                await input(tagsInput, 'routing')
                tagsInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
                await flush()
                assert(tagsInput.disabled, 'Three tags prevents a fourth while removals remain available')
                await click(document.querySelector('[aria-label="Remove tags custom-review"]'))
                assert(!tagsInput.disabled, 'Removing a chip unlocks the tag input')
                await click(document.querySelector('[aria-label="Remove tags Routing"]'))
                tagsInput.focus()
                await input(tagsInput, 'SENTIMENT')
                tagsInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
                await flush()
                assert(document.querySelectorAll('[aria-label="Remove tags Sentiment"]').length === 1, 'Catalogue label is used consistently without duplicate tags')
                tagsInput.focus()
                await input(tagsInput, 'review, rou')
                await flush()
                assert(document.querySelector('[aria-label="Remove tags review"]') && tagsInput.value === ' rou', 'Comma commits one tag and retains the remaining search')
                tagsInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }))
                tagsInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
                await flush()
                assert(document.querySelector('[aria-label="Remove tags Routing"]'), 'Keyboard selection chooses an existing suggestion')
                await click(document.querySelector('[aria-label="Remove tags review"]'))
                await click(document.querySelector('[aria-label="Remove tags Routing"]'))
                await input(document.querySelector('[data-jev-edit-view] input'), 'My initial sentiment')
                await click('Save')
                await until(() => button('Save'))
                assert(
                    recipes.size === 1 &&
                        recipes.get('sentiment').document.name === 'My initial sentiment' &&
                        recipes.get('sentiment').document.content === 'Email' &&
                        JSON.stringify(recipes.get('sentiment').document.tags) === JSON.stringify(['Sentiment']),
                    'Editing display name retains its filename identity',
                )
                await input(document.querySelector('[data-jev-edit-view] input'), 'Message sentiment')
                await click('Save')
                await until(() => button('Save'))
                assert(button('Save').previousElementSibling === button('Check'), 'Check recipe immediately precedes Save recipe')
                assert([...document.querySelectorAll('button')].filter((b) => b.textContent.trim() === 'Check').length === 1, 'One recipe check control in the header')
                await click('Check')
                assert(document.querySelector('[data-jev-message][data-tone=success] [data-jev-message-icon]'), 'Recipe validation shows a compact success icon')
                await click(document.querySelector('[aria-label="Dismiss notice"]'))
                const originalEditorRecipe = copy(recipes.get('sentiment').document)
                await click('Add field')
                await click('Add question')
                assert(document.querySelector('[aria-label="Delete field New field"]').getBoundingClientRect().height > 0, 'Field delete is visible without opening key settings')
                assert(document.querySelector('[aria-label="Delete question Question 1"]').getBoundingClientRect().height > 0, 'Question delete is visible without opening key settings')
                await click('Save')
                const withRemovals = copy(recipes.get('sentiment').document)
                withRemovals.inputSchema.required.push('field_1')
                withRemovals.state = { mode: 'text', field: 'field_1' }
                withRemovals.presentation.questions.question_1 = { label: 'Disposable question' }
                for (const example of withRemovals.examples) {
                    example.input.field_1 = 'Temporary input'
                    example.expected ||= {}
                    example.expected.question_1 = false
                }
                await click('Recipe JSON')
                await input(document.querySelector('[data-jev-json-editor] textarea'), JSON.stringify(withRemovals, null, 2))
                assert(button('Check').disabled, 'Check waits for unapplied JSON edits')
                assert(document.querySelector('[data-jev-message][data-tone=warning] [data-jev-message-icon]'), 'JSON edits show the styled warning icon')
                await click('Apply JSON')
                await click('Visual editor')
                const fieldDelete = document.querySelector('[aria-label="Delete field New field"]'),
                    questionDelete = document.querySelector('[aria-label="Delete question Disposable question"]')
                fieldDelete.closest('details').open = false
                questionDelete.closest('details').open = false
                await click(fieldDelete)
                await click(questionDelete)
                await click('Save')

                )
                assert(
                    recovered.find((row) => row.key !== key).value.input.text === 'mine final',
                    'Latest edits preserved in recovery copy',
                )
                document.documentElement.dataset.stage = 'file-import'
                const beforeFileImport = recipes.size
                await click('Import recipe')
                await until(() => document.querySelectorAll('[data-jev-import-card]').length === 7)
                await click('From JSON')
                await click('Import from file')
                assert(
                    !document.querySelector('[data-jev-import-dialog][open]'),
                    'File import closes collection modal',
                )
                const upload = document.querySelector('input[type="file"]'),
                    transfer = new DataTransfer(),
                    fileDoc = copy(writing)
                fileDoc.name = 'Uploaded recipe'
                transfer.items.add(
                    new File([JSON.stringify(fileDoc)], 'portable.recipe.json', { type: 'application/json' }),
                )
                upload.files = transfer.files
                upload.dispatchEvent(new Event('change', { bubbles: true }))
                await until(() =>
                    document.querySelector('[data-jev-recipe-header]').textContent.includes('Uploaded recipe'),
                )
                assert(
                    recipes.size === beforeFileImport + 1 &&
                        !document.querySelector('[data-jev-recipe-header]').textContent.includes('NEW RECIPE'),
                    'File import is saved as an owned recipe',
                )
                const uploadedId = [...recipes.values()].find(
                    (row) => row.document.name === 'Uploaded recipe',
                ).id
                assert(uploadedId === 'portable.recipe' && recipes.get(uploadedId).filename === 'portable.recipe.json', 'File import keeps uploaded filename as its ID')
                await input(document.querySelector('[data-jev-edit-view] input'), 'Edited uploaded recipe')
                await click('Save')
                await until(() => button('Save'))
                assert(
                    recipes.size === beforeFileImport + 1 &&
                        recipes.get(uploadedId).document.name === 'Edited uploaded recipe',
                    'Imported display name edit preserves uploaded filename',
                )
                const renamedId = uploadedId,
                    replacement = { ...copy(fileDoc), name: renamedId, description: 'Replacement from file' },
                    uploadAgain = async () => {
                        const data = new DataTransfer()
                        data.items.add(new File([JSON.stringify(replacement)], recipes.get(renamedId).filename, { type: 'application/json' }))
                        upload.files = data.files
                        upload.dispatchEvent(new Event('change', { bubbles: true }))
                        await until(() => document.querySelector('#jev-confirm-title'))
                    }
                runs.set('old-file-history', { id: 'old-file-history', recipeId: renamedId, name: renamedId, status: 'succeeded', model: 'jev', createdAt: 1 })
                const historyCount = runs.size
                await uploadAgain()
                assert(document.querySelector('#jev-confirm-title').parentElement.textContent.includes(renamedId), 'File import warning names existing recipe')
                await click('Keep it')
                assert(runs.has('old-file-history') && recipes.get(renamedId).document.description !== replacement.description, 'Cancelled file import retains recipe and history')
                await uploadAgain()
                await click('Replace recipe & clear history')
                await until(() => recipes.get(renamedId).document.description === replacement.description && !runs.has('old-file-history'))
                assert(runs.size === historyCount - 1 && recipes.size === beforeFileImport + 1, 'File replacement clears only matching history and retains one recipe')
                await until(() => button('Save'))
                await click('Save as a copy')
                await until(() => recipes.has(renamedId + ' (copy)'))
                assert(recipes.get(renamedId + ' (copy)').id === renamedId + ' (copy)', 'Save as a copy uses an unused filename as ID')
                await click('Import recipe')
                await until(() => document.querySelectorAll('[data-jev-import-card]').length === 7)
                document
                    .querySelector('[data-jev-import-dialog]')
                    .dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: 0, clientY: 0 }))
                await flush()
                assert(
                    !document.querySelector('[data-jev-import-dialog][open]'),
                    'Outside click closes import modal',
                )
                assert(!document.querySelector('[data-jev-studio]').textContent.includes('Recipe ready to use and edit.'), 'Import does not show the redundant editing notice')
                document.documentElement.dataset.stage = 'final-render'
                assert(vueErrors.length === 0, 'No Vue rendering errors')
                document.querySelectorAll('[data-jev-recipe-row]')[2].click()
                await flush()
                await click('Try example')
                await click('Run decision')
                await wait(650)
                await flush()
                if (query.has('editor') || query.has('notices') || query.has('tags')) {
                    await click('Edit')
                    await click('Check')
                    if (query.has('notices')) {
                        await click('Recipe JSON')
                        const source = document.querySelector('[data-jev-json-editor] textarea')
                        await input(source, source.value + ' ')
                    }
                    document.querySelector('[data-jev-workspace]').scrollIntoView({ block: 'start' })
                    await flush()
                    const banner = document.querySelector('[data-jev-message][data-tone=warning]')
                    if (banner) assert(banner.scrollWidth <= banner.clientWidth, 'Warning notice fits its available width')
                }
                if (query.has('tags')) {
                    const tagSearch = document.querySelector('[aria-label="Search or create tags"]')
                    tagSearch.focus()
                    await input(tagSearch, 'ver')
                }
                if (query.has('example-name')) {
                    await click('Save as example')
                    await until(() => document.querySelector('#jev-example-name')?.value)
                    const dialog = document.querySelector('[data-jev-save-example-dialog]')
                    assert(dialog.open && dialog.contains(document.activeElement), 'Naming dialog contains keyboard focus')
                    assert(dialog.scrollWidth <= dialog.clientWidth + 1 && dialog.getBoundingClientRect().width <= window.innerWidth, 'Naming dialog fits the viewport')
                }
                if (query.has('examples')) {
                    await click('Save as example')
                    await until(() => document.querySelector('#jev-example-name')?.value)
                    await click('Save example')
                    for (const example of document.querySelectorAll('[data-jev-example]')) example.querySelector('details').open = true
                    await flush()
                }
                if (query.has('import')) {
                    await click('Import recipe')
                    await until(() => document.querySelectorAll('[data-jev-import-card]').length === 7)
                }
                if (query.has('ai') || query.has('picker')) {
                    await click('Create with AI')
                    if (query.has('picker')) {
                        document.querySelector('[aria-label="Choose recipe-writing model"]').click()
                        await flush()
                    }
                }
                document.getElementById('result').textContent =
                    'PASS: visible editor deletion and cleanup, header recipe check, styled notices, filename stems as IDs, stable name edits and copy, collection and file replacement warnings, cancellation and history clearing, AI dialog, shared controls, forms, primitives, results, drafts, origin ownership, retry, examples, history, remount, responsive layout'
            } catch (e) {
                document.getElementById('result').textContent =
                    'FAIL: ' + e.message + '\n' + e.stack + '\n' + vueErrors.join('\n')
            } finally {
                clearInterval(keepAlive)
            }
        </script>
    </body>
</html>
