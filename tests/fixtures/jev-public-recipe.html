<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/llms/ui/app.css"><link rel="stylesheet" href="/publisher/recipes.css"><script type="importmap">{"imports":{"vue":"/llms/ui/lib/vue.mjs"}}</script><style>body{margin:0;background:repeating-linear-gradient(45deg,#729fcf 0px,#729fcf 30px,#293b55 30px,#293b55 60px);color:white}#result{font:12px sans-serif;white-space:pre-wrap}</style></head><body><div id="app"></div><pre id="result">RUNNING</pre><script>for(const kind of ['error','unhandledrejection'])window.addEventListener(kind,e=>document.querySelector('#result').textContent='FAIL: '+(e.message||e.reason?.stack||e.reason))</script><script type="module">

const detail={externalRef:'fixture',starCount:1,starred:false,...fixture,name:fixture.document.name,description:fixture.document.description,author:{userName:'llmspy'},fieldCount:2,questionCount:1,tags:fixture.document.tags,revision:1,publishedAt:'2026-10-03T09:01:04.492666',updatedAt:'2026-10-03T09:01:04.492666',downloadUrl:'/d/fixture/recipe.json'}

 if(String(path).endsWith('/star')){detail.starred=JSON.parse(options.body).starred;detail.starCount=detail.starred?2:1;return Response.json({starCount:detail.starCount,starred:detail.starred})}

const errors=[],app=createApp(RecipePage);app.config.errorHandler=e=>errors.push(e.message);const vm=app.mount('#app')

try{
 await flush();await flush()

  assert((confidence.dataset.strength||null)===strength,'Correct confidence strength at '+value);assert(style.borderTopStyle==='solid'&&style.borderTopWidth==='1px'&&style.backgroundColor!=='rgba(0, 0, 0, 0)','Confidence pill has a border and background')
  if(value===null)assert(!fill&&confidence.textContent==='Confidence unavailable','Unavailable confidence has no fill')
  else{assert(fill.style.width===(value*100)+'%'&&Math.abs(fill.getBoundingClientRect().width-confidence.clientWidth*value)<1,'Confidence fill tracks the value at '+value);assert(getComputedStyle(fill).backgroundImage.includes('linear-gradient'),'Confidence fill has a gradient');themes.add(style.backgroundColor);if(value===0.75)assert(confidence.textContent==='Confidence 75% · High','0.75 uses the High pill')}
 }
 assert(themes.size===4,'Every confidence level has its own background theme');answer.confidence=0.75;await flush();const confidence=document.querySelector('.recipe-results .jev-confidence summary');confidence.click();await flush();assert(confidence.parentElement.open&&confidence.parentElement.textContent.includes('not measured accuracy'),'Clicking confidence reveals its explanation');confidence.click();answer.confidence=originalConfidence;await flush();assert(getComputedStyle(document.querySelector('.jev-track > div')).backgroundColor===probabilityColor,'Probability bars retain their neutral color')
 assert(document.querySelector('.recipe-inputs').textContent.includes('Revenue increased'),'Readable captured inputs')
 assert(!document.querySelector('.recipe-details').open,'Raw prompt collapsed')
 assert(!document.querySelector('.recipe-meta').textContent.includes('T09:'),'Dates formatted')
 const surface=document.querySelector('.recipe-public-inner');assert(getComputedStyle(surface).backgroundColor!=='rgba(0, 0, 0, 0)','Opaque content');assert(document.documentElement.scrollWidth<=innerWidth+1,'No horizontal overflow')
 const usage=document.querySelector('.recipe-additional');usage.open=true;await flush();assert(usage.querySelector('.recipe-usage-example:last-child .recipe-results')?.textContent.includes('Supported'),'Saved usage examples render actual outputs');assert(usage.querySelectorAll('.recipe-usage-example').length===fixture.document.examples.length,'All usage examples rendered');usage.open=false
 await click('JSON');const exact=JSON.parse(document.querySelector('.recipe-preview pre').textContent);assert(exact.execution.prompt.claim===fixture.execution.prompt.claim,'Exact captured prompt retained');assert(exact.document.examples.length===fixture.document.examples.length,'Authored examples retained');await click('Preview')
 await click('Import into Jev');assert(document.querySelector('[aria-label="Recipe share link"]').value===location.origin+location.pathname,'Import instructions include share link');await click('Copy link');assert(copied===location.origin+location.pathname,'Copies page link');await click('Import into Jev')
 assert(errors.length===0,'No Vue errors: '+errors.join(','));document.querySelector('#result').textContent='PASS: opaque public recipe, readable inputs and dates, exact snapshot JSON, import instructions, copy and responsive layout'
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack+'\n'+errors.join('\n')}
</script></body></html>
