 setState:s=>Object.assign(ctx.state,s),setGlobals:s=>Object.assign(ctx,s),setError:e=>{throw new Error(e)},scope:name=>({ctx,

  throw new Error('Unexpected GET '+url)
 },
 async postJson(url,data){

   if(failOrder)return {error:{message:'Project list changed. Try again.'}}
   projects=[...data.ids.map(id=>projects.find(p=>p.id===id)),...projects.filter(p=>p.archived)];revision++
   return {response:clone(projects)}
  }
  throw new Error('Unexpected POST '+url)
 },
 async patchJson(url,data){
  posted.push({url,data})
  if(url.startsWith('/archive/')){
   if(failArchive)return {error:{message:'Unable to archive project. Try again.'}}
   const id=url.split('/').at(-1),project=projects.find(p=>p.id===id)
   if(data.archived){project.archivedSidebarVisibility=project.showInSidebar!==false;project.archived=true;project.showInSidebar=false}
   else {project.archived=false;project.showInSidebar=project.archivedSidebarVisibility!==false;delete project.archivedSidebarVisibility}
   projects=projects.filter(p=>p.id!==id)
   if(data.archived)projects.push(project)
   else {const end=projects.findIndex(p=>p.archived);projects.splice(end<0?projects.length:end,0,project)}
   revision++;return {response:clone(projects)}
  }
  throw new Error('Unexpected PATCH '+url)
 }})}

 await flush()

 row('one').querySelector('button').click();await flush()

 assert(repositoryInput.value==='https://github.com/ServiceStack/llms.git'&&repositoryInput.readOnly,'Saved clone URL is visible and read-only')
 assert(document.querySelector('[aria-label="Open repository"]').href==='https://github.com/ServiceStack/llms','HTTPS clone opens the repository page')

 assert(button('Select Project'),'Repository display does not mark project as edited')
 button('Reorder').click();await flush()
 const handle=row('one').querySelector('[data-project-drag-handle]');handle.focus()
 handle.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));await flush()
 assert(rows()==='two,one,three','Arrow key saves new order')
 assert(document.querySelector('[aria-current="true"]').closest('[data-project-id]').dataset.projectId==='one','Selection follows stable identity')
 assert(document.activeElement.dataset.id==='one','Keyboard focus follows moved handle')
 assert(document.querySelector('#app input').value==='Website','Selected form stays on same project')
 // Synthetic pointers exercise the production hit testing and drop behavior; capture needs a trusted pointer.
 const dragRow=row('three'),dragLabel=dragRow.querySelector('button')
 dragRow.setPointerCapture=()=>{};dragRow.hasPointerCapture=()=>false
 const source=dragLabel.getBoundingClientRect(),target=row('two').getBoundingClientRect()
 const pointer=(type,x,y)=>dragLabel.dispatchEvent(new PointerEvent(type,{pointerId:1,button:0,clientX:x,clientY:y,bubbles:true}))
 pointer('pointerdown',source.x+8,source.y+8);pointer('pointermove',target.x+20,target.y+3);await flush()

 assert(Math.abs(preview.getBoundingClientRect().y-(target.y+3-8))<1,'Floating copy follows the pointer offset')
 assert(row('two').style.transform!=='translateY(0px)'&&row('three').style.transform!=='translateY(0px)','Rows shift to leave a landing gap')
 pointer('pointerup',target.x+20,target.y+3);await flush()
 assert(rows()==='three,two,one','Dragging folder label saves order')
 assert(!document.querySelector('[data-project-drag-preview]'),'Dropping removes floating copy')
 dragLabel.click();await flush()
 assert(document.querySelector('#app input').value==='Website','Dragging a row does not switch the selected project')

 const cancelled=row('two'),cancelLabel=cancelled.querySelector('button')
 cancelled.setPointerCapture=()=>{};cancelled.hasPointerCapture=()=>false
 const cancelledBounds=cancelLabel.getBoundingClientRect(),firstBounds=row('three').getBoundingClientRect()
 const cancelPointer=(type,x,y)=>cancelLabel.dispatchEvent(new PointerEvent(type,{pointerId:2,button:0,clientX:x,clientY:y,bubbles:true}))

 cancelPointer('pointerdown',cancelledBounds.x+8,cancelledBounds.y+8)
 cancelPointer('pointermove',firstBounds.x+20,firstBounds.y+3);await flush()
 cancelPointer('pointercancel',firstBounds.x+20,firstBounds.y+3);await flush()
 assert(rows()==='three,two,one'&&!document.querySelector('[data-project-drag-preview]')&&posted.length===savedCount,'Cancelling restores original positions without saving')
 cancelPointer('pointerdown',cancelledBounds.x+8,cancelledBounds.y+8)
 cancelPointer('pointermove',0,0);await flush();cancelPointer('pointerup',0,0);await flush()
 assert(rows()==='three,two,one'&&posted.length===savedCount,'Dropping outside the list does not reorder')

 scrollList.style.flex='0 0 60px';await flush()

 await search('website');assert(archiveRows()==='old,one','Search matches names')
