name: Python compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run cross-platform regression tests
        run: python -m unittest tests.test_config tests.test_utils tests.test_windows_compat tests.test_publish_extension tests.test_web_assets

  ui-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run UI startup and chat regression tests
        run: |
          node tests/test_ui_startup.mjs
          node tests/test_chat_drafts.mjs
          node tests/test_draft_persistence.mjs
          node tests/test_plan_action.mjs
          node tests/test_mcp_ui_contract.mjs
