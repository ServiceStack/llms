name: Desktop release

on:
  release:
    types: [published]
  push:
    tags:
      - desktop-v*

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # desktop-v* releases were already built when their tag was pushed.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'desktop-v')
    environment: desktop-release
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app,dmg
          - os: macos-15-intel
            bundles: app,dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify desktop and release versions
        run: python desktop/scripts/check-version.py --tag "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install and verify desktop runtime
        run: |
          python -m pip install -r desktop/requirements-build.txt
          python -m unittest discover -s desktop/tests -p 'test_*.py'
          python desktop/scripts/build-sidecar.py
          python desktop/scripts/verify-sidecar.py

      - name: Configure optional signing and updates
        id: release-config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python desktop/scripts/prepare-release-config.py --allow-unsigned

      - name: Build, sign, and publish native bundles
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: llms.py Desktop ${{ env.RELEASE_TAG }}
          releaseBody: Native llms.py desktop installers for macOS, Linux, and Windows.
          releaseDraft: ${{ github.event_name == 'push' }}
          prerelease: ${{ github.event.release.prerelease || false }}
          includeUpdaterJson: ${{ steps.release-config.outputs.updater_enabled == 'true' }}
          args: --config build/tauri.release.conf.json --bundles ${{ matrix.bundles }}
